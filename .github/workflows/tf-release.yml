# Rebuild GridCraft's web app with the Taskforce patches for every upstream release.
#
# Every six hours: find storytold/gridcraft's latest release, re-apply the commits of
# `tf/stack` on top of that tag, build, run the gate, and publish
# `gridcraft-web-<version>-tf.<n>.zip` with its checksum as a release of this fork.
# Taskforce installs only what is published here, so a release that the patches no
# longer apply to, that fails a test, or that fails the browser gate never reaches it:
# the run fails, nothing is published, and the last good build stays in use. What is
# published is still not in use at once: Taskforce tries it for a day first (its worker,
# apps/worker/src/tasks/office-apps.ts).
#
# Nothing is rebuilt when the pair (upstream version, tf/stack commit) already has a
# release.
name: tf-release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (default: storytold/gridcraft's latest release)"
        required: false
      force:
        description: "Build even when this version and stack already have a release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tf-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/gridcraft
  STACK_BRANCH: tf/stack
  TRUNK_VERSION: "0.22.1"
  TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1
  KEEP_RELEASES: "6"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      stack: ${{ steps.plan.outputs.stack }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          tag="${WANT_TAG:-}"
          if [ -z "$tag" ]; then tag=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name); fi
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "unexpected upstream tag: $tag" >&2; exit 1 ;; esac
          version="${tag#v}"
          stack=$(gh api "repos/$GITHUB_REPOSITORY/branches/$(printf %s "$STACK_BRANCH" | sed 's#/#%2F#g')" -q .commit.sha)
          key="upstream=$tag stack=$stack"
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" -q "[.[] | select(.body | contains(\"$key\"))] | length")
          build=true
          if [ "$have" != "0" ] && [ "${FORCE:-false}" != "true" ]; then build=false; fi
          echo "upstream $tag, stack $stack, already released: $have, build: $build"
          { echo "build=$build"; echo "tag=$tag"; echo "version=$version"; echo "stack=$stack"; } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      STACK: ${{ needs.plan.outputs.stack }}
    steps:
      - name: Gate and workflow files (this branch)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Patch stack with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STACK_BRANCH }}
          path: src
          fetch-depth: 0

      - name: Re-apply the stack on the upstream tag
        working-directory: src
        run: |
          set -euo pipefail
          git config user.name "tf-release"
          git config user.email "tf-release@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
          base=$(git merge-base "$STACK" "$TAG")
          commits=$(git rev-list --reverse "$base..$STACK")
          [ -n "$commits" ] || { echo "the stack has no commits on top of upstream" >&2; exit 1; }
          git checkout -q -B build "$TAG"
          for c in $commits; do
            if ! git cherry-pick --allow-empty "$c"; then
              # The lock file is regenerated by cargo; any other conflict is a real one.
              others=$(git diff --name-only --diff-filter=U | grep -v '^Cargo.lock$' || true)
              if [ -n "$others" ]; then
                echo "::error::patch $(git log -1 --format='%h %s' "$c") no longer applies to $TAG: $others"
                exit 1
              fi
              git checkout --ours Cargo.lock
              git add Cargo.lock
              git -c core.editor=true cherry-pick --continue
            fi
          done
          git log --oneline "$TAG..HEAD"
          echo "RUST_VERSION=$(awk '/^\[/{p=($0=="[workspace.package]")} p && $1=="rust-version"{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)" >> "$GITHUB_ENV"

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Co-editing engine tests and two-client fuzz
        working-directory: src
        env:
          GRIDCRAFT_COLLAB_SEEDS: "400"
        run: cargo test --release -p gridcraft-engine collab

      - name: Build the command-line tool
        working-directory: src
        run: cargo build --release -p gridcraft-cli

      - name: Trunk ${{ env.TRUNK_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o trunk.tgz "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  trunk.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf trunk.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the web app
        working-directory: src/apps/gridcraft-web
        run: trunk build --release --dist "$GITHUB_WORKSPACE/dist/web" --public-url ./

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The build people have open when this one arrives: the newest one published here. The gate
      # co-edits between the two, both ways. The first build ever has none to meet.
      - name: Previous published build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" -q '[.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-tf\\.[0-9]+$"))][0].tag_name // ""')
          if [ -z "$prev" ]; then echo "no earlier build"; exit 0; fi
          mkdir -p prev/unpacked
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir prev --pattern 'gridcraft-web-*.zip' --pattern SHA256SUMS.txt
          (cd prev && grep 'gridcraft-web-.*\.zip$' SHA256SUMS.txt | sha256sum -c -)
          unzip -q prev/gridcraft-web-*.zip -d prev/unpacked
          dir=$(find prev/unpacked -maxdepth 2 -name index.html -print -quit | xargs dirname)
          echo "PREV_DIST=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_ENV"
          echo "previous build: $prev"

      - name: Browser gate
        working-directory: ci/gate
        run: |
          set -euo pipefail
          npm ci
          CHROME_PATH="$(command -v google-chrome)" node gate.mjs --dist "$GITHUB_WORKSPACE/dist/web" --cli "$GITHUB_WORKSPACE/src/target/release/gridcraft-cli" ${PREV_DIST:+--prev-dist "$PREV_DIST"}

      - name: Package
        run: |
          set -euo pipefail
          name="gridcraft-web-$VERSION-tf.$GITHUB_RUN_NUMBER"
          mkdir -p "out/$name"
          cp -R dist/web/. "out/$name/"
          (cd out && zip -qr9 "$name.zip" "$name")
          cp src/target/release/gridcraft-cli "out/gridcraft-cli-$VERSION-tf.$GITHUB_RUN_NUMBER-linux-x86_64"
          (cd out && sha256sum "$name.zip" "gridcraft-cli-$VERSION-tf.$GITHUB_RUN_NUMBER-linux-x86_64" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rel="v$VERSION-tf.$GITHUB_RUN_NUMBER"
          {
            echo "GridCraft $VERSION with the Taskforce patches."
            echo
            echo "upstream=$TAG stack=$STACK"
            echo
            echo "Passed: co-editing engine tests, two-client fuzz (400 seeds), browser gate (bridge, protocol and capability contract, browser and native parity, workbook meaning against the golden, co-editing with the previous build both ways)."
          } > notes.md
          gh release create "$rel" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$rel" --notes-file notes.md \
            "out/gridcraft-web-$VERSION-tf.$GITHUB_RUN_NUMBER.zip" "out/gridcraft-cli-$VERSION-tf.$GITHUB_RUN_NUMBER-linux-x86_64" out/SHA256SUMS.txt
          # Keep the newest few; the rest only take space.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.tag_name | test("-tf\\.[0-9]+$")) | .tag_name' \
            | tail -n +"$((KEEP_RELEASES + 1))" \
            | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
